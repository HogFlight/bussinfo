<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172b42"><title>Min pendling</title>
<style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172b42;background:#f2f5f8}*{box-sizing:border-box}body{max-width:580px;margin:0 auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:12px 0 0}p{margin:6px 0;color:#64748b}.tabs{display:flex;gap:6px;background:#e2e8f0;padding:5px;border-radius:13px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:13px;font-weight:650;color:#334155}.tabs button.active{background:#fff;box-shadow:0 1px 4px #0002}button{font:inherit;cursor:pointer}#refresh{width:100%;background:#172b42;color:#fff;border:0;border-radius:11px;padding:14px;margin:16px 0;font-weight:650}#refresh:disabled{opacity:.55}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0000000d}.headline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}.clock{font-size:26px;font-variant-numeric:tabular-nums}.label{background:#e8eef7;border-radius:8px;padding:5px 8px;font-size:13px}.details{font-size:14px;color:#64748b;line-height:1.7}.warn{color:#b45309;font-weight:700}.error{background:#fee2e2;padding:14px;border-radius:12px}.muted{color:#64748b}.rt{color:#047857}.nr{color:#64748b}footer{font-size:12px;color:#64748b;margin-top:30px}</style></head><body>
<header><div><h1>Min pendling</h1><p>Vikingstad ↔ Forskningsbyn / Nobeltorget</p></div><span aria-hidden="true" style="font-size:30px">🚉</span></header>
<div class="tabs"><button id="work">Till jobbet</button><button id="home">Hem</button></div>
<p id="status">Ingen sökning genomförd.</p><main id="results" aria-live="polite"></main><button id="refresh">↻ Uppdatera</button>
<footer>Data från <a href="https://www.trafiklab.se/">Trafiklab.se</a>. Realtidsstatus är inte detsamma som bekräftad GPS-position. Byte kräver minst fem minuter.</footer>
<script>
// Ange bara den offentliga URL:en till din Cloudflare Worker här. Aldrig API-nyckeln.
const API_URL='/api';
const stockholmHour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Stockholm',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
let mode=stockholmHour>=12?'home':'work';
const $=id=>document.getElementById(id);
const fmt=s=>s?s.slice(11,16):'–';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){ $('work').classList.toggle('active',mode==='work');$('home').classList.toggle('active',mode==='home');refresh(); }
function delay(d){if(d.canceled)return '<span class="warn">Inställd</span>';if(!d.is_realtime)return '<span class="nr">Ingen realtid</span>';const m=Math.round((d.delay||0)/60);return `<span class="${m>0?'warn':'rt'}">${m>0?'+'+m+' min':m<0?m+' min':'I tid'} · Realtid</span>`}
async function refresh(){let btn=$('refresh');btn.disabled=true;$('status').textContent='Hämtar avgångar…';$('results').innerHTML='';try{
 const u=new URL(API_URL);u.searchParams.set('mode',mode);const response=await fetch(u);const data=await response.json();if(!response.ok)throw new Error(data.error||'API-fel');
 $('status').textContent=`Uppdaterad ${new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(data.updated))} · kommande 60 min`;
 if(!data.journeys.length){$('results').innerHTML='<div class="card">Inga kompletta resor hittades. Det kan bero på avgångsfönstret eller att detaljdata saknas.</div>';return;}
 $('results').innerHTML=data.journeys.map(j=>`<article class="card"><div class="headline"><span class="clock">${fmt(j.start)}</span><span class="label">${j.kind==='575'?'Buss 575':'Tåg + buss 4'}</span><span class="clock">${fmt(j.end)}</span></div><p>${j.kind==='575'?'Vikingstad ↔ Forskningsbyn':'Vikingstad ↔ Nobeltorget'}</p><div class="details">${j.legs.map((l,i)=>`<div>${i+1}. ${escapeHTML(l.departure.designation)} ${fmt(l.depart)} → ${fmt(l.arrive)} · ${delay(l.departure)}${l.departure.platform?' · Läge '+escapeHTML(l.departure.platform):''}</div>`).join('')}${j.connectionMinutes!==undefined?`<div>Byte i Linköping: ${j.connectionMinutes} min</div>`:''}</div></article>`).join('');
 }catch(e){$('status').textContent='Kunde inte uppdatera';$('results').innerHTML=`<div class="error">${escapeHTML(e.message)}. Kontrollera Worker-adressen och att nyckeln är sparad som en hemlighet.</div>`;}finally{btn.disabled=false;}}
$('work').onclick=()=>{mode='work';render()};$('home').onclick=()=>{mode='home';render()};$('refresh').onclick=refresh;render();
</script></body></html>
